name: Niigata Event Reminder

on:
  schedule:
    # 毎日日本時間 7:00 JST (前日 22:00 UTC) と 20:00 JST (当日 11:00 UTC) に自動実行
    - cron: '0 22 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      target_day:
        description: 'リマインド対象日 (today: 本日 / tomorrow: 明日 / auto: 時間判定)'
        required: false
        default: 'auto'

permissions:
  contents: read

jobs:
  run-reminder:
    runs-on: ubuntu-latest

    steps:
    - name: レポジトリのチェックアウト
      uses: actions/checkout@v3

    - name: Python環境のセットアップ
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 依存ライブラリのインストール
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 新潟リマインド通知の実行
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
      run: |
        python niigata_reminder.py ${{ github.event.inputs.target_day }}
