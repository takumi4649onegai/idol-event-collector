name: Database Maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform (SELECT or DELETE)'
        required: true
        default: 'SELECT'
        type: choice
        options:
        - SELECT
        - DELETE

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
    - name: レポジトリのチェックアウト
      uses: actions/checkout@v3

    - name: Python環境のセットアップ
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 依存ライブラリのインストール
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: メンテナンス処理の実行
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        MAINTENANCE_ACTION: ${{ github.event.inputs.action }}
      run: |
        python db_maintenance.py

    - name: バックアップファイルのアップロード
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: db-backup
        path: db_backup_*.json
        if-no-files-found: ignore
