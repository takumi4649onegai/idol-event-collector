name: Underground Idol Event Collector

on:
  schedule:
    # 日本時間 (JST) の「12:00, 15:00, 18:00, 21:00, 翌1:00」の1日5回自動実行する超合理的・省エネ設定
    # ※GitHub Actionsは標準時(UTC)で動くため、日本時間から9時間を引いた時間（3, 6, 9, 12, 16 UTC）に設定します
    - cron: '0 3,6,9,12,16 * * *'
  workflow_dispatch:
    # GitHub上のWebUIから手動でいつでも実行可能にする設定

permissions:
  contents: write

jobs:
  run-collector:
    runs-on: ubuntu-latest

    steps:
    - name: レポジトリのチェックアウト
      uses: actions/checkout@v3

    - name: Python環境のセットアップ
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 依存ライブラリのインストール
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Playwrightのブラウザ・システム依存関係のインストール
      run: |
        python -m playwright install chromium --with-deps

    - name: コレクタープログラムの実行
      env:
        LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
        LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        ENABLE_X_SCRAPING: 'True'
        ENABLE_TIGET_SCRAPING: 'True'
        ENABLE_LIVEPOCKET_SCRAPING: 'True'
        NITTER_BASE_URL: 'https://nitter.poast.org'
      run: |
        python main.py
